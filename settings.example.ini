# Copy this file to settings.ini.
# The installer reads the first settings.ini it finds:
#   1. The -SettingsPath argument
#   2. Next to these scripts
#   3. The current directory
#   4. C:\kd\s3\settings.ini
#
# When AccessKey and SecretKey are present and valid, the installer uses
# them. When a key is missing or not valid, the installer asks for that key.
# A blank optional line is ignored and the built-in default stays in place.
# Lines starting with # or ; are comments.

AccessKey=
SecretKey=

Endpoint=https://s31.knoxxa.digital
DriveLetter=K:
Region=us-east-1
RemoteName=knoxxa
VolumeName=Knoxxa Digital
LogFile=C:\kd\s3\log.txt
